openapi: 3.0.3
info:
  title: API de Bootcamps
  version: 1.0.0
  description: Documentación de la API para la gestión de bootcamps.

servers:
  - url: http://localhost:8082
    description: Servidor Local de Desarrollo

paths:
  /api/v1/bootcamp:
    post:
      summary: Crear un nuevo bootcamp
      description: Recibe los datos de un bootcamp, valida restricciones, asigna capacidades y lo registra en el sistema.
      operationId: createBootcamp
      parameters:
        - in: header
          name: x-message-id
          required: true
          schema:
            type: string
          description: Identificador único del mensaje para trazabilidad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBootcampRequestDTO'
      responses:
        '201':
          description: Bootcamp creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootcampResponseDTO'
        '400':
          description: Parámetros inválidos o error de negocio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'

  /api/v1/bootcamps:
    get:
      summary: Listar bootcamps de forma paginada
      description: Obtiene una lista paginada de bootcamps con sus respectivas capacidades y tecnologías, con opciones de ordenamiento.
      operationId: listBootcamps
      parameters:
        - in: header
          name: x-message-id
          required: false
          schema:
            type: string
          description: Identificador único del mensaje para trazabilidad
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 0
          description: Número de página (inicia en 0)
        - in: query
          name: size
          required: false
          schema:
            type: integer
            default: 10
          description: Cantidad de elementos por página
        - in: query
          name: sortBy
          required: false
          schema:
            type: string
            default: name
          description: Campo por el cual ordenar
        - in: query
          name: direction
          required: false
          schema:
            type: string
            enum: [ASC, DESC]
            default: ASC
          description: Dirección del ordenamiento
      responses:
        '200':
          description: Lista de bootcamps paginada obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootcampPageResponseDTO'
        '400':
          description: Parámetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDTO'

components:
  schemas:
    CreateBootcampRequestDTO:
      type: object
      required:
        - name
        - description
        - launchDate
        - durationInWeeks
        - capabilities
      properties:
        name:
          type: string
          example: Bootcamp Backend Avanzado
        description:
          type: string
          example: Programa intensivo en arquitecturas reactivas
        launchDate:
          type: string
          format: date
          example: "2026-11-15"
        durationInWeeks:
          type: integer
          example: 8
        capabilities:
          type: array
          items:
            type: integer
            format: int64
          example: [1, 2]

    BootcampResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Bootcamp Backend Avanzado
        description:
          type: string
          example: Programa intensivo en arquitecturas reactivas
        launchDate:
          type: string
          format: date
          example: "2026-11-15"
        durationInWeeks:
          type: integer
          example: 8
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityResponseDTO'

    CapabilityResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Backend Development
        technologies:
          type: array
          items:
            $ref: '#/components/schemas/TechnologyResponseDTO'

    TechnologyResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Spring Boot

    BootcampPageResponseDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/BootcampResponseDTO'
        pageNumber:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 10
        totalElements:
          type: integer
          format: int64
          example: 15
        totalPages:
          type: integer
          example: 2

    ErrorDTO:
      type: object
      properties:
        code:
          type: string
          example: "ERR_01"
        message:
          type: string
          example: "El campo no puede estar vacío"

    ApiResponseDTO:
      type: object
      properties:
        code:
          type: string
          example: "400"
        message:
          type: string
          example: "Bad Request"
        identifier:
          type: string
          example: "msg-456789"
        date:
          type: string
          format: date-time
          example: "2026-10-28T16:30:00Z"
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDTO'